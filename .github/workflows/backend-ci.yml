name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-api/pyproject.toml

      - name: Install backend and test dependencies
        working-directory: backend-api
        run: python -m pip install -e ".[dev]"

      - name: Run backend tests
        working-directory: backend-api
        run: python -m pytest -q

      - name: Build microservice container image
        run: docker build --tag multilingual-tourist-guide:ci --file backend-api/Dockerfile .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_GATEWAY_DEPLOY_HOOK: ${{ secrets.RENDER_GATEWAY_DEPLOY_HOOK }}
          RENDER_AUTH_DEPLOY_HOOK: ${{ secrets.RENDER_AUTH_DEPLOY_HOOK }}
          RENDER_POI_DEPLOY_HOOK: ${{ secrets.RENDER_POI_DEPLOY_HOOK }}
          RENDER_PRESENCE_DEPLOY_HOOK: ${{ secrets.RENDER_PRESENCE_DEPLOY_HOOK }}
        run: |
          hooks=(
            "$RENDER_GATEWAY_DEPLOY_HOOK"
            "$RENDER_AUTH_DEPLOY_HOOK"
            "$RENDER_POI_DEPLOY_HOOK"
            "$RENDER_PRESENCE_DEPLOY_HOOK"
          )
          configured=0
          for hook in "${hooks[@]}"; do
            if [ -n "$hook" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 4 ]; then
            for hook in "${hooks[@]}"; do
              curl --fail --silent --show-error --request POST "$hook"
            done
          elif [ "$configured" -ne 0 ]; then
            echo "::error::Configure all four Render microservice deploy hooks, or remove all four."
            exit 1
          elif [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          else
            echo "::warning::No Render deploy hook is configured; skipping deployment."
          fi
