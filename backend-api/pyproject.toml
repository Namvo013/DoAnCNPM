[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tourist-audio-guide-api"
version = "0.1.0"
description = "Multilingual tourist audio guide backend"
requires-python = ">=3.10"
dependencies = [
    "deep-translator>=1.11",
    "edge-tts>=7.0",
    "fastapi>=0.115,<0.129",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.9,<2.13",
    "pydantic-settings>=2.6,<2.13",
    "pymongo>=4.11",
    "PyJWT>=2.9",
    "python-multipart>=0.0.12",
    "qrcode>=8.0",
    "reportlab>=4.2",
    "redis>=5.2",
    "uvicorn>=0.32",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.26",
    "mongomock-motor>=0.0.34",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
